<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Journey</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --glass: rgba(10, 10, 10, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --accent: #ffffff;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--accent);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Fullscreen Canvas */
        canvas {
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
        }

        /* Cinematic Vignette (Dark corners) */
        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.4) 50%, black 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* Timer Display */
        .timer-display {
            position: absolute;
            top: 15%;
            font-size: 1.2rem;
            letter-spacing: 4px;
            z-index: 10;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
            transition: opacity 0.5s;
        }

        /* The Final Popup */
        .glass-card {
            z-index: 50;
            position: relative;
            padding: 5rem 8rem;
            
            /* Glass Effect */
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-top: 1px solid rgba(255,255,255,0.3);
            border-radius: 2px;
            box-shadow: 0 50px 100px black;
            
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            
            opacity: 0;
            transform: scale(0.9) translateY(20px);
            transition: all 1s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .glass-card.show {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        h1 {
            font-size: 5rem;
            font-weight: 900;
            margin: 0;
            line-height: 0.9;
            text-transform: uppercase;
            color: white;
            /* Subtle text shadow */
            text-shadow: 0 0 30px rgba(255,255,255,0.2);
        }

        .sub {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            letter-spacing: 0.6em;
            text-transform: uppercase;
            color: #888;
        }

        /* White Flash Overlay */
        .flash-white {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 100; opacity: 0; pointer-events: none;
            transition: opacity 3s ease-out;
        }
    </style>
</head>
<body>

    <div class="flash-white" id="flash"></div>
    <div class="vignette"></div>
    <canvas id="universe"></canvas>
    
    <div class="timer-display" id="timer">SEQUENCE STARTED</div>

    <div class="glass-card" id="final-card">
        <h1>Fuck You<br>Dude.</h1>
        <div class="sub">Message Received</div>
    </div>

    <script>
        /**
         * ENGINE SETUP
         * No external images = No loading times.
         */
        const canvas = document.getElementById('universe');
        const ctx = canvas.getContext('2d');
        let w, h, cx, cy;

        function resize() {
            w = window.innerWidth;
            h = window.innerHeight;
            canvas.width = w;
            canvas.height = h;
            cx = w / 2; cy = h / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- PROCEDURAL GENERATION CLASSES ---

        // 1. Tiny Realistic Stars
        class Star {
            constructor() { this.reset(true); }
            reset(init) {
                this.x = (Math.random() - 0.5) * w * 3;
                this.y = (Math.random() - 0.5) * h * 3;
                this.z = init ? Math.random() * 3000 : 3000;
                this.brightness = Math.random();
            }
            update(speed) {
                this.z -= speed;
                if(this.z <= 1) this.reset();
            }
            draw() {
                let x = (this.x / this.z) * w + cx;
                let y = (this.y / this.z) * w + cy;
                if(x<0 || x>w || y<0 || y>h) return;

                let alpha = (1 - this.z / 3000) * this.brightness;
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                let size = this.z < 1000 ? 1.5 : 0.8; 
                ctx.fillRect(x, y, size, size); // Crisp pixels
            }
        }

        // 2. Procedural Galaxy (Spiral Gradients)
        class Galaxy {
            constructor() {
                this.x = (Math.random() - 0.5) * w * 4;
                this.y = (Math.random() - 0.5) * h * 2;
                this.z = 4000;
                this.angle = Math.random() * Math.PI * 2;
                this.color = Math.random() > 0.5 ? '200, 100, 255' : '100, 200, 255'; // Purple or Cyan
            }
            update(speed) {
                this.z -= speed;
                this.angle += 0.002;
            }
            draw() {
                if(this.z < 100) return;
                let x = (this.x / this.z) * w + cx;
                let y = (this.y / this.z) * w + cy;
                let scale = (1 - this.z / 4000) * 200;
                if(scale < 0) return;

                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(this.angle);
                
                // Draw Spiral Core
                let grad = ctx.createRadialGradient(0,0, 0, 0,0, scale);
                grad.addColorStop(0, 'white');
                grad.addColorStop(0.2, `rgba(${this.color}, 0.8)`);
                grad.addColorStop(1, 'transparent');
                
                ctx.fillStyle = grad;
                ctx.beginPath(); 
                // Flatten to look like a disk
                ctx.ellipse(0, 0, scale*2, scale, 0, 0, Math.PI*2);
                ctx.fill();
                
                ctx.restore();
            }
        }

        // 3. Procedural Planet (Saturn-like with Rings)
        class Planet {
            constructor() {
                this.x = (Math.random() - 0.5) * w * 4;
                this.y = (Math.random() - 0.5) * h * 2;
                this.z = 4000;
                this.radius = 50 + Math.random() * 100;
                this.tilt = (Math.random() - 0.5);
            }
            update(speed) { this.z -= speed; }
            draw() {
                if(this.z < 50) return;
                let x = (this.x / this.z) * w + cx;
                let y = (this.y / this.z) * w + cy;
                let scale = (1 - this.z / 4000);
                let r = this.radius * scale;
                if(r < 0) return;

                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(this.tilt);

                // Draw Rings (Behind)
                ctx.beginPath();
                ctx.ellipse(0, 0, r*2.5, r*0.6, 0, 0, Math.PI*2);
                ctx.strokeStyle = 'rgba(200, 180, 150, 0.4)';
                ctx.lineWidth = r/5;
                ctx.stroke();

                // Draw Planet Body
                let grad = ctx.createRadialGradient(-r/2, -r/2, 0, 0, 0, r);
                grad.addColorStop(0, '#eec');
                grad.addColorStop(1, '#864');
                ctx.fillStyle = grad;
                ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();

                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.beginPath(); ctx.arc(r/3, r/3, r, 0, Math.PI*2); ctx.fill();

                ctx.restore();
            }
        }

        // --- STATE & ANIMATION ---
        const stars = Array(1000).fill().map(() => new Star());
        const spaceObjects = [];
        let startTime = Date.now();
        let speed = 20;
        let phase = 0;

        function animate() {
            let elapsed = Date.now() - startTime;
            let rawTime = 10 - elapsed/1000;
            let timeLeft = Math.max(0, rawTime).toFixed(2);
            
            // Timer Display Logic
            if(rawTime > 0) {
                document.getElementById('timer').innerText = `T-MINUS ${timeLeft}s`;
            } else {
                document.getElementById('timer').style.opacity = 0;
            }

            // --- TIMELINE ---
            // 2s: Galaxy
            if(elapsed > 2000 && phase === 0) {
                phase = 1;
                spaceObjects.push(new Galaxy());
            }
            // 5s: Planet
            if(elapsed > 5000 && phase === 1) {
                phase = 2; speed = 50;
                spaceObjects.push(new Planet());
            }
            // 8s: Warp Speed & Black Hole visuals
            if(elapsed > 8000 && phase === 2) {
                phase = 3; speed = 120;
            }
            // 10s: End
            if(elapsed > 10000) {
                endSequence();
                return;
            }

            // --- DRAW FRAME ---
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, w, h);

            stars.forEach(s => { s.update(speed); s.draw(); });
            
            spaceObjects.forEach(obj => {
                obj.update(speed);
                obj.draw();
            });

            // Black Hole Effect (Procedural)
            if(phase === 3) {
                let p = (elapsed - 8000) / 2000; // 0 to 1
                let r = p * w * 0.8;
                
                // Draw Accretion Disk Glow
                let grad = ctx.createRadialGradient(cx, cy, r*0.8, cx, cy, r*1.2);
                grad.addColorStop(0, 'black');
                grad.addColorStop(0.4, 'orange');
                grad.addColorStop(1, 'transparent');
                
                ctx.globalCompositeOperation = 'screen';
                ctx.fillStyle = grad;
                ctx.beginPath(); ctx.arc(cx, cy, r*2, 0, Math.PI*2); ctx.fill();
                
                // Draw Event Horizon (Black Void)
                ctx.globalCompositeOperation = 'source-over';
                ctx.fillStyle = 'black';
                ctx.beginPath(); ctx.arc(cx, cy, r*0.9, 0, Math.PI*2); ctx.fill();
            }

            requestAnimationFrame(animate);
        }

        function endSequence() {
            document.getElementById('flash').style.opacity = 1;
            setTimeout(() => {
                canvas.style.display = 'none';
                document.getElementById('flash').style.opacity = 0;
                document.getElementById('final-card').classList.add('show');
            }, 1000);
        }

        // START IMMEDIATELY
        animate();

    </script>
</body>
</html>
