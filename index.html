<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Realism</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Rajdhani:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --neon: #00f3ff;
            --danger: #ff004c;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- LAYERS --- */
        canvas {
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
        }

        /* Cinematic Vignette */
        .vignette {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 30%, black 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* Noise/Grain */
        .noise {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://media.giphy.com/media/oEI9uBYSzLpBK/giphy.gif'); /* Subtle noise gif */
            opacity: 0.05;
            pointer-events: none;
            z-index: 3;
        }

        /* --- HUD --- */
        .hud {
            position: absolute;
            z-index: 10;
            width: 100%;
            padding: 40px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            top: 0;
        }

        .hud-item {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            color: var(--neon);
            text-shadow: 0 0 10px var(--neon);
            letter-spacing: 2px;
        }

        .timer-big {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            color: rgba(255,255,255,0.5);
            z-index: 10;
        }

        /* --- THE REVEAL --- */
        .glass-panel {
            z-index: 50;
            position: relative;
            padding: 6rem 8rem;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.1);
            
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .glass-panel.show {
            opacity: 1;
            transform: scale(1);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 5rem;
            font-weight: 900;
            margin: 0;
            line-height: 1;
            text-transform: uppercase;
            background: linear-gradient(45deg, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0,0,0,1);
        }

        .sub {
            margin-top: 1rem;
            font-size: 1.2rem;
            letter-spacing: 5px;
            color: var(--neon);
            text-transform: uppercase;
        }

        /* --- FX --- */
        .flash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 100; opacity: 0; pointer-events: none;
            transition: opacity 2s ease-out;
        }

        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both infinite; }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }
    </style>
</head>
<body>

    <div class="flash" id="flash-screen"></div>
    <div class="vignette"></div>
    <div class="noise"></div>
    <canvas id="space"></canvas>

    <div class="hud" id="hud-ui">
        <div class="hud-item">SYS: ONLINE</div>
        <div class="hud-item" id="warn" style="color: var(--danger); opacity: 0;">WARNING: GRAVITY WELL</div>
        <div class="hud-item">LOC: DEEP VOID</div>
    </div>

    <div class="timer-big" id="timer">10.00</div>

    <div class="glass-panel" id="card">
        <h1>Fuck You<br>Dude.</h1>
        <div class="sub">From the cosmos</div>
    </div>

    <script>
        const canvas = document.getElementById('space');
        const ctx = canvas.getContext('2d');
        let w, h, cx, cy;

        // --- ASSET LOADER ---
        // Using Wikimedia/NASA URLs (High reliability)
        const assets = {
            galaxy: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c3/NGC_4414_%28NASA-med%29.jpg/800px-NGC_4414_%28NASA-med%29.jpg",
            earth: "https://upload.wikimedia.org/wikipedia/commons/thumb/9/97/The_Earth_seen_from_Apollo_17.jpg/1024px-The_Earth_seen_from_Apollo_17.jpg",
            jupiter: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2b/Jupiter_and_its_shrunken_Great_Red_Spot.jpg/800px-Jupiter_and_its_shrunken_Great_Red_Spot.jpg",
            saturn: "https://upload.wikimedia.org/wikipedia/commons/c/c7/Saturn_during_Equinox.jpg",
            blackhole: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/42/Black_Hole_Milkyway.jpg/800px-Black_Hole_Milkyway.jpg" // Abstract representation
        };

        const loadedImages = {};
        
        // Preload images logic
        Object.keys(assets).forEach(key => {
            const img = new Image();
            img.src = assets[key];
            loadedImages[key] = img;
        });

        function resize() {
            w = window.innerWidth;
            h = window.innerHeight;
            canvas.width = w;
            canvas.height = h;
            cx = w / 2;
            cy = h / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- CLASSES ---

        class Star {
            constructor() { this.reset(true); }
            reset(init) {
                this.x = (Math.random() - 0.5) * w * 2;
                this.y = (Math.random() - 0.5) * h * 2;
                this.z = init ? Math.random() * 2000 : 2000;
                this.size = Math.random() * 2;
            }
            update(speed) {
                this.z -= speed;
                if(this.z <= 0) this.reset();
            }
            draw() {
                let x = (this.x / this.z) * w + cx;
                let y = (this.y / this.z) * w + cy;
                let s = (1 - this.z / 2000) * 3 * this.size;
                if(x<0 || x>w || y<0 || y>h) return;
                
                ctx.fillStyle = `rgba(255,255,255, ${1 - this.z/2000})`;
                ctx.beginPath(); ctx.arc(x,y,s,0,Math.PI*2); ctx.fill();
            }
        }

        class CelestialBody {
            constructor(type, imgKey) {
                this.type = type; // 'galaxy' or 'planet'
                this.img = loadedImages[imgKey];
                this.x = (Math.random() - 0.5) * w * 4;
                this.y = (Math.random() - 0.5) * h * 2;
                this.z = 3000; // Far start
                this.angle = Math.random() * Math.PI;
                this.rotSpeed = (Math.random() - 0.5) * 0.02;
            }
            update(speed) {
                this.z -= speed;
                this.angle += this.rotSpeed;
            }
            draw() {
                if(!this.img || this.z < 100) return;
                
                let x = (this.x / this.z) * w + cx;
                let y = (this.y / this.z) * w + cy;
                let scale = (1 - this.z / 3000);
                let size = (this.type === 'galaxy' ? 600 : 300) * scale;
                
                if(scale < 0) return;

                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(this.angle);
                
                // COOL TRICK: 'screen' blending makes black backgrounds transparent
                // This allows us to use JPEGs of planets/space without ugly boxes
                ctx.globalCompositeOperation = 'screen'; 
                ctx.globalAlpha = scale;
                
                try {
                    ctx.drawImage(this.img, -size/2, -size/2, size, size);
                } catch(e) {} // Prevent crash if image not loaded

                ctx.restore();
                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = 1;
            }
        }

        // --- STATE ---
        const stars = Array(600).fill().map(() => new Star());
        const bodies = [];
        let startTime = Date.now();
        let speed = 20;
        let phase = 0; // 0=Stars, 1=Galaxies, 2=Planets, 3=Hole
        
        function animate() {
            let elapsed = Date.now() - startTime;
            let timeLeft = Math.max(0, 10 - elapsed/1000).toFixed(2);
            document.getElementById('timer').innerText = timeLeft;

            // --- TIMELINE ---
            // 3s: Galaxies
            if(elapsed > 3000 && phase === 0) {
                phase = 1;
                // Add Galaxies
                for(let i=0; i<3; i++) bodies.push(new CelestialBody('galaxy', 'galaxy'));
            }
            // 6s: Solar System
            if(elapsed > 6000 && phase === 1) {
                phase = 2;
                speed = 40;
                // Add Planets
                bodies.push(new CelestialBody('planet', 'saturn'));
                setTimeout(() => bodies.push(new CelestialBody('planet', 'jupiter')), 500);
                setTimeout(() => bodies.push(new CelestialBody('planet', 'earth')), 1000);
            }
            // 8s: Black Hole Approach
            if(elapsed > 8000 && phase === 2) {
                phase = 3;
                speed = 100; // Warp speed
                document.getElementById('warn').style.opacity = 1;
                document.body.classList.add('shake');
            }
            // 10s: Drop
            if(elapsed > 10000) {
                finish();
                return;
            }

            // --- DRAW ---
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, w, h);

            // Stars
            stars.forEach(s => { s.update(speed); s.draw(); });

            // Bodies (Galaxies/Planets)
            bodies.forEach((b, i) => {
                b.update(speed);
                b.draw();
                if(b.z < 0) bodies.splice(i, 1);
            });

            // Black Hole (Phase 3 Overlay)
            if(phase === 3) {
                let size = (elapsed - 8000) * 0.5;
                let holeImg = loadedImages.blackhole;
                if(holeImg) {
                    ctx.save();
                    ctx.translate(cx, cy);
                    // Spin the hole
                    ctx.rotate(elapsed * 0.005);
                    ctx.globalCompositeOperation = 'screen'; // Blend it
                    // Draw massive expanding hole
                    ctx.drawImage(holeImg, -size, -size, size*2, size*2);
                    ctx.restore();
                }
            }

            requestAnimationFrame(animate);
        }

        function finish() {
            document.getElementById('flash-screen').style.opacity = 1;
            document.getElementById('hud-ui').style.opacity = 0;
            document.getElementById('timer').style.opacity = 0;
            document.body.classList.remove('shake');
            
            setTimeout(() => {
                canvas.style.display = 'none';
                document.getElementById('flash-screen').style.opacity = 0;
                document.getElementById('card').classList.add('show');
            }, 500);
        }

        // Start
        animate();

    </script>
</body>
</html>
